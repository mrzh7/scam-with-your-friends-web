name: Update star history
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/star-history.mjs
      - scripts/star-history.test.mjs
      - .github/workflows/star-history.yml
permissions:
  contents: write
concurrency:
  group: star-history
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/star-history.test.mjs
      - run: node scripts/star-history.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Publish updated charts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/media/star-history-*.svg
          if ! git diff --cached --quiet; then
            git commit -m "docs: refresh star history [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
